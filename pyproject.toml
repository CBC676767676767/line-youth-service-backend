[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "line-youth-service-backend"
version = "0.1.0"
description = "Task-driven youth application service backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.36,<2.1", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23.1", "pyotp>=2.9,<3", "cryptography>=44",
  "pillow>=11", "pypdf>=5", "email-validator>=2.2,<3", "jsonschema>=4.23,<5",
  "tzdata>=2025.2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "pip-tools>=7.4", "pytest-cov>=6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/*.html", "web/*.js", "web/*.css", "web/*.svg", "data/*.json", "data/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Two suites import helpers from scripts/, which is not an installed package.
# `python -m pytest` happens to put the working directory on sys.path and the
# pytest console script does not, so without this the suite passes locally and
# fails in CI.
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
